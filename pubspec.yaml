name: cifra_game
description: "Финансовая грамотность в кармане: симулятор жизни и бюджета"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  shared_preferences: ^2.2.2
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^1.1.0
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  intl: ^0.19.0
  confetti: ^0.7.0
  glassmorphism: ^3.0.0
  animated_text_kit: ^4.2.2
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
